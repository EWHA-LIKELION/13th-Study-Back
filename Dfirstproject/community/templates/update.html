<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>update</title>
    </head>
    <body>
        <h1>Updating Q</h1>

        <form action="{% url 'update2' question_update.id %}" method="post">
            {% csrf_token %}
            <p>제목: <input type="text" name="title" value="{{question_update.title}}" /> </p>
            본문 :
            <textarea name="content" cols="30" rows="10">{{question_update.content}}</textarea>
            <p>해시태그: <input type="text" name = "hashtags" value="{% for tag in question_update.hashtag.all %}{{ tag.hashtag }}, {% endfor %}" placeholder=",로 구분" /></p>
            <button type="submit">수정하기</button>
        </form>
    </body>
</html>
